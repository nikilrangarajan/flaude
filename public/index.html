<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flaude</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: #ffffff;
      color: #1d1d1f;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 680px;
      padding: 64px 24px 32px;
      text-align: center;
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #1d1d1f;
      line-height: 1;
    }

    header p {
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: 400;
      color: #6e6e73;
      letter-spacing: -0.01em;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 680px;
      overflow-y: auto;
      padding: 8px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.975rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #1d1d1f;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #f5f5f7;
      color: #1d1d1f;
      border-bottom-left-radius: 4px;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aeaeb2;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-5px); opacity: 1; }
    }

    #input-area {
      width: 100%;
      max-width: 680px;
      padding: 12px 24px 40px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #msg {
      flex: 1;
      background: #f5f5f7;
      border: none;
      border-radius: 22px;
      color: #1d1d1f;
      font-family: inherit;
      font-size: 0.975rem;
      padding: 12px 18px;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
      transition: background 0.2s;
    }

    #msg:focus { background: #ebebed; }
    #msg::placeholder { color: #aeaeb2; }

    #send {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #1d1d1f;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    #send:hover { background: #3a3a3c; }
    #send:active { transform: scale(0.93); }
    #send:disabled { background: #d1d1d6; cursor: not-allowed; }

    #send svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

<header>
  <h1>Flaude</h1>
  <p>Your worst best friend</p>
</header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="msg" rows="1" placeholder="Ask Flaude anything..."></textarea>
  <button id="send" title="Send">
    <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>
</div>

<script>
  const chat    = document.getElementById("chat");
  const msg     = document.getElementById("msg");
  const sendBtn = document.getElementById("send");
  const history = [];

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "bubble assistant";
    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    div.appendChild(dots);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function submit() {
    const text = msg.value.trim();
    if (!text) return;

    msg.value = "";
    msg.style.height = "auto";
    sendBtn.disabled = true;

    addBubble("user", text);
    history.push({ role: "user", content: text });

    const typing = addTyping();

    try {
      const res  = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      const reply = data.content || data.error || "Something went wrong.";
      typing.remove();
      addBubble("assistant", reply);
      history.push({ role: "assistant", content: reply });
    } catch {
      typing.remove();
      addBubble("assistant", "Even I'm speechless. Try again?");
    }

    sendBtn.disabled = false;
    msg.focus();
  }

  sendBtn.addEventListener("click", submit);

  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });

  msg.addEventListener("input", () => {
    msg.style.height = "auto";
    msg.style.height = Math.min(msg.scrollHeight, 140) + "px";
  });

  // Opening message
  const opener = "Well, hello there, beautiful disaster! I'm Flaude, and I have EXACTLY the advice you didn't know you needed. What life situation shall we absolutely not think through carefully today?";
  addBubble("assistant", opener);
  history.push({ role: "assistant", content: opener });
</script>

</body>
</html>
