<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flaude — Your Worst Best Friend</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Georgia", serif;
      background: #0f0f0f;
      color: #f0ece4;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 720px;
      padding: 24px 20px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: normal;
      letter-spacing: 0.03em;
      color: #f5c842;
    }

    header p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 4px;
      font-style: italic;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 720px;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #2a2a2a;
      border-bottom-right-radius: 4px;
      color: #f0ece4;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #1e1a0e;
      border: 1px solid #3d3520;
      border-bottom-left-radius: 4px;
      color: #f5e8b0;
    }

    .bubble.assistant .name {
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #f5c842;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .typing-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #f5c842;
      margin: 0 2px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }

    #input-area {
      width: 100%;
      max-width: 720px;
      padding: 12px 20px 24px;
      display: flex;
      gap: 10px;
    }

    #msg {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      color: #f0ece4;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px 16px;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color 0.2s;
    }

    #msg:focus { border-color: #f5c842; }
    #msg::placeholder { color: #555; }

    #send {
      background: #f5c842;
      color: #0f0f0f;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      width: 46px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    #send:hover { background: #ffd84d; }
    #send:active { transform: scale(0.95); }
    #send:disabled { background: #3a3520; color: #666; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>Flaude</h1>
  <p>Your Worst Best Friend &mdash; Confidently Wrong Since Always</p>
</header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="msg" rows="1" placeholder="Ask Flaude for life advice..."></textarea>
  <button id="send" title="Send">&#8593;</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const msg  = document.getElementById("msg");
  const send = document.getElementById("send");
  const history = [];

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    if (role === "assistant") {
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = "Flaude";
      div.appendChild(name);
    }
    const body = document.createElement("span");
    body.textContent = text;
    div.appendChild(body);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "bubble assistant";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "Flaude";
    div.appendChild(name);
    const dots = document.createElement("span");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    div.appendChild(dots);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function submitMessage() {
    const text = msg.value.trim();
    if (!text) return;

    msg.value = "";
    msg.style.height = "auto";
    send.disabled = true;

    addBubble("user", text);
    history.push({ role: "user", content: text });

    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      const reply = data.content || data.error || "Something went wrong.";
      typing.remove();
      addBubble("assistant", reply);
      history.push({ role: "assistant", content: reply });
    } catch (e) {
      typing.remove();
      addBubble("assistant", "Even I'm at a loss for words. Try again?");
    }

    send.disabled = false;
    msg.focus();
  }

  send.addEventListener("click", submitMessage);

  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitMessage();
    }
  });

  msg.addEventListener("input", () => {
    msg.style.height = "auto";
    msg.style.height = Math.min(msg.scrollHeight, 140) + "px";
  });

  // Opening message
  window.addEventListener("load", () => {
    const opener = "Well, hello there, beautiful disaster! I'm Flaude, and I have EXACTLY the advice you didn't know you needed. What life situation shall we absolutely not think through carefully today?";
    addBubble("assistant", opener);
    history.push({ role: "assistant", content: opener });
  });
</script>

</body>
</html>
