<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flaude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cormorant:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e8e6e1;
      --ink: #111110;
      --muted: #8a887f;
      --accent: #e8401c;
      --bubble-user: #111110;
      --bubble-ai: #d8d6d1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 48px;
    }

    .topbar-logo {
      font-family: "Cormorant Garant", serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .topbar-tag {
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Hero ── */
    .hero {
      padding: 20px 48px 40px;
      position: relative;
    }

    .hero-title {
      font-family: "Cormorant Garant", serif;
      font-size: clamp(5rem, 14vw, 11rem);
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--ink);
      user-select: none;
    }

    .hero-title em {
      font-style: italic;
      font-weight: 300;
    }

    .hero-sub {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .hero-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .hero-sub span {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Divider ── */
    hr {
      border: none;
      border-top: 1px solid #c8c6c1;
      margin: 0 48px;
    }

    /* ── Chat ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 62%;
      padding: 11px 16px;
      border-radius: 4px;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: #ffffff;
      border-radius: 4px 4px 1px 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--bubble-ai);
      color: var(--ink);
      border-radius: 4px 4px 4px 1px;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 18px;
      padding: 0 4px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Input ── */
    #input-area {
      padding: 16px 48px 40px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    #msg {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid #b0ada6;
      border-radius: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 0.9rem;
      padding: 10px 0;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.2s;
    }

    #msg:focus { border-bottom-color: var(--ink); }
    #msg::placeholder {
      color: #aaa9a3;
      letter-spacing: 0.04em;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    #send {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 10px 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 2px;
    }

    #send:hover { background: #2a2a28; }
    #send:active { transform: scale(0.97); }
    #send:disabled { background: #c0bdb8; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">Flaude</span>
  <span class="topbar-tag">AI Life Coach &mdash; Confidently Wrong Since Always</span>
</div>

<div class="hero">
  <div class="hero-title">
    <em>Your</em> Worst<br>Best Friend
  </div>
  <div class="hero-sub">
    <div class="hero-dot"></div>
    <span>Flaude &mdash; Advice you didn't know you needed</span>
  </div>
</div>

<hr />

<div id="chat"></div>

<div id="input-area">
  <textarea id="msg" rows="1" placeholder="Ask Flaude anything..."></textarea>
  <button id="send">Send</button>
</div>

<script>
  const chat    = document.getElementById("chat");
  const msg     = document.getElementById("msg");
  const sendBtn = document.getElementById("send");
  const history = [];

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "bubble assistant";
    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    div.appendChild(dots);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function submit() {
    const text = msg.value.trim();
    if (!text) return;

    msg.value = "";
    msg.style.height = "auto";
    sendBtn.disabled = true;

    addBubble("user", text);
    history.push({ role: "user", content: text });

    const typing = addTyping();

    try {
      const res  = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      const reply = data.content || data.error || "Something went wrong.";
      typing.remove();
      addBubble("assistant", reply);
      history.push({ role: "assistant", content: reply });
    } catch {
      typing.remove();
      addBubble("assistant", "Even I'm speechless. Try again?");
    }

    sendBtn.disabled = false;
    msg.focus();
  }

  sendBtn.addEventListener("click", submit);

  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });

  msg.addEventListener("input", () => {
    msg.style.height = "auto";
    msg.style.height = Math.min(msg.scrollHeight, 120) + "px";
  });

  const opener = "Well, hello there, beautiful disaster! I'm Flaude, and I have EXACTLY the advice you didn't know you needed. What life situation shall we absolutely not think through carefully today?";
  addBubble("assistant", opener);
  history.push({ role: "assistant", content: opener });
</script>

</body>
</html>
